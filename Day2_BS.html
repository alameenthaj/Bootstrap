<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>
<body>
    <div class="container text-center">
        <div class="row">
            <div class="col mt-5">
                <h3 class="display-4">Student Profile</h3>
                <blockquote class = "blockquote">
                         <p><h6 class="display-6"> “Learning never exhausts the mind.”</h6></p>
                 </blockquote>
            </div>
        </div> 
    </div>

    <div class="container">
        <div class="col mt-2">
            <img src="https://tse4.mm.bing.net/th/id/OIP.UUGCUjX_4DCGhhqoE4PpoQHaHa?r=0&w=512&h=512&rs=1&pid=ImgDetMain&o=7&rm=3" 
               class="img-fluid rounded-circle mx-auto d-block" alt="Profile Image" style="max-width: 200px; height: auto;">
        </div>

           <table class="table table-striped">
            <thead class="table-dark">
              <tr>
                <th>Subject</th>
                <th>Marks</th>
               </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mathematics</td>
                <td>95</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>89</td>
            </tr>
            <tr>
                <td>English</td>
                <td>92</td>
            </tr>
        </tbody>
    </table>
        <div class="alert alert-success alert-dismissible">
           <button type="button" class="close" data-dismiss="alert">&times;</button>
           Profile loaded successfully!
        </div>
</body>
</html>
