<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Progress Dashboard</title>
       <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
          <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
             <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
                <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>

<div class="container mt-5">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb justify-content-center">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Courses</a></li>
            <li class="breadcrumb-item active" aria-current="page">
                Web Development
             </li>
        </ol>
    </nav>

    <!-- Heading -->
    <h2 class="text-center mb-4">
        Web Development Course
        <span class="badge bg-danger">New</span>
    </h2>

    <!-- Progress Bars -->
    <div class="mb-4">

        <label class="fw-bold mb-1">HTML</label>
        <div class="progress mb-3" style="height:25px;">
            <div class="progress-bar bg-success progress-bar-striped"
                 style="width:100%;">
                HTML - 100%
            </div>
        </div>

        <label class="fw-bold mb-1">CSS</label>
        <div class="progress mb-3" style="height:25px;">
            <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated"
                 style="width:75%;">
                CSS - 75%
            </div>
        </div>

        <label class="fw-bold mb-1">JavaScript</label>
        <div class="progress mb-3" style="height:25px;">
            <div class="progress-bar bg-warning text-dark"
                 style="width:50%;">
                JavaScript - 50%
            </div>
        </div>

        <label class="fw-bold mb-1">Bootstrap</label>
        <div class="progress mb-4" style="height:25px;">
            <div class="progress-bar bg-danger"
                 style="width:25%;">
                Bootstrap - 25%
            </div>
        </div>

    </div>

    <!-- Button Group -->
    <div class="text-center mb-4">
        <div class="btn-group" role="group">
            <button class="btn btn-success">Start</button>
            <button class="btn btn-warning">Pause</button>
            <button class="btn btn-danger">Reset</button>
        </div>
    </div>

    <!-- Pagination -->
    <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item active">
                <a class="page-link" href="#">1</a>
            </li>
            <li class="page-item">
                <a class="page-link" href="#">2</a>
            </li>
            <li class="page-item disabled">
                <a class="page-link" href="#" tabindex="-1" aria-disabled="true">3</a>
            </li>
        </ul>
    </nav>

</div>

</body>
</html>
